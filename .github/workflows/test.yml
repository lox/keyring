name: Continuous Integration
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.x"
          - "1.26.x"
        os:
          - ubuntu-latest
          - macos-latest

    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}

    steps:
      # actions/checkout v6
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      # actions/setup-go v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pass gnome-keyring dbus-x11
      - name: Install macOS integration dependencies
        if: runner.os == 'macOS'
        run: brew install pass gnupg
      - run: go test -race ./...
